<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>NOCTUA — Grey Hat IDE</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
</head>
<body>
<header>
  <span class="logo">NOCTUA</span><span class="sub">GREY HAT IDE v0.3</span>
  <span style="margin-left:auto; display:flex; gap:8px;">
    <span class="badge ok">sandbox listo</span>
    <span class="badge" id="provider-badge">cargando…</span>
    <button class="badge action" id="btn-open">Abrir fichero</button>
    <button class="badge action" id="btn-analyze">Analizar (v0.2)</button>
  </span>
</header>
<div class="wrap">
  <div id="sidebar">
    <h3>Workspace</h3>
    <div id="tree-toolbar">
      <button class="badge action" id="btn-open-dir">Abrir carpeta</button>
      <button class="badge action" id="btn-collapse">Contraer</button>
    </div>
    <div id="tree"></div>
    <h3>Plugins</h3><div id="pluginlist"></div>
  </div>
  <div id="editorArea">
    <div id="editor"></div>
    <div id="analysis">
      <div id="an-head">
        <span class="name" id="an-name">—</span>
        <span class="badge" id="an-type">—</span>
        <span class="sha" id="an-sha" title="clic para copiar">sha256</span>
        <span id="an-risk"></span>
        <button class="badge action" id="btn-close-analysis" style="margin-left:auto;">✕ volver al editor</button>
      </div>
      <div id="an-progress"><div></div></div>
      <div id="an-filters">
        <span style="color:#64748b;font-size:11px;">fuente:</span>
        <div id="an-chips"></div>
        <input id="an-search" placeholder="buscar en hallazgos…"/>
      </div>
      <div id="an-list"></div>
      <div id="an-detail">Seleccione un hallazgo para ver su detalle y referencias.</div>
      <div id="explain-box"></div>
      <div id="an-bottom">
        <button id="btn-explain">Explicar hallazgos (agente)</button>
        <span style="color:#64748b;font-size:11px;">el agente recibe solo el JSON del triaje, nunca el binario</span>
      </div>
    </div>
  </div>
  <div id="ai">
    <div id="ai-head">
      <button id="p-mistral" class="active">API Mistral</button>
      <button id="p-ollama">Ollama local</button>
    </div>
    <div id="chat"></div>
    <div id="ai-input">
      <textarea id="prompt" placeholder="Pregunta al agente sobre el código… (Ctrl+Enter para enviar)"></textarea>
      <button id="send">Enviar al agente</button>
    </div>
  </div>
</div>
<div id="bottom">
  <div id="tabs">
    <button id="tab-output" class="active">SALIDA</button>
    <button id="tab-term">＋ TERMINAL</button>
  </div>
  <div id="output"></div>
  <div id="realterm"></div>
</div>

<script src="vendor/monaco/vs/loader.js"></script>
<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit/addon-fit.js"></script>
<script src="terminal.js"></script>
<script src="tree.js"></script>
<script src="app.js"></script>
</body>
</html>
