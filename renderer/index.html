<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NOCTUA — Grey Hat IDE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0b0e14; color: #e2e8f0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; background: #0d1117; border-bottom: 1px solid #1c2230; }
  .logo { color: #22d3ee; font-weight: bold; letter-spacing: 3px; }
  .sub { color: #64748b; font-size: 11px; }
  .badge { border: 1px solid #1c2230; border-radius: 4px; padding: 2px 8px; font-size: 11px; color: #94a3b8; }
  .badge.ok { color: #34d399; border-color: #065f46; }
  .badge.action { cursor: pointer; background: none; font: inherit; }
  .badge.action:hover { color: #22d3ee; border-color: #0e7490; }
  .wrap { display: flex; height: calc(100vh - 44px - 140px); }
  #sidebar { width: 240px; background: #0d1117; border-right: 1px solid #1c2230; padding: 10px; overflow-y: auto; }
  #sidebar h3 { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin: 8px 4px 6px; }
  .file { display: block; width: 100%; text-align: left; background: none; border: none; color: #94a3b8; font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer; border-radius: 4px; }
  .file:hover { background: #1e293b; }
  .file.active { background: #164e63; color: #67e8f9; }
  #editor { flex: 1; min-width: 0; }
  #ai { width: 320px; background: #0d1117; border-left: 1px solid #1c2230; display: flex; flex-direction: column; }
  #ai-head { padding: 10px; border-bottom: 1px solid #1c2230; display: flex; gap: 6px; }
  #ai-head button { flex: 1; background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 4px; padding: 5px; font: inherit; font-size: 11px; cursor: pointer; }
  #ai-head button.active { background: #164e63; color: #67e8f9; border-color: #0e7490; }
  #chat { flex: 1; overflow-y: auto; padding: 10px; }
  .msg { margin-bottom: 10px; padding: 8px; border-radius: 6px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { background: #164e63; color: #cffafe; text-align: right; }
  .msg.bot { background: #0b0e14; border: 1px solid #1c2230; color: #cbd5e1; }
  #ai-input { padding: 10px; border-top: 1px solid #1c2230; display: flex; flex-direction: column; gap: 6px; }
  #ai-input textarea { background: #0b0e14; color: #e2e8f0; border: 1px solid #1c2230; border-radius: 6px; padding: 8px; font: inherit; resize: none; height: 70px; }
  #ai-input button { background: #0e7490; color: white; border: none; border-radius: 6px; padding: 8px; font: inherit; cursor: pointer; }
  #bottom { height: 140px; background: #0d1117; border-top: 1px solid #1c2230; display: flex; flex-direction: column; }
  #tabs { display: flex; gap: 2px; padding: 6px 12px 0; }
  #tabs button { background: none; border: none; color: #64748b; font: inherit; font-size: 11px; padding: 4px 10px; cursor: pointer; border-bottom: 2px solid transparent; }
  #tabs button.active { color: #67e8f9; border-bottom-color: #06b6d4; }
  #terminal { flex: 1; overflow-y: auto; padding: 8px 14px; font-size: 11px; color: #94a3b8; line-height: 1.6; }
  #terminal .err { color: #f87171; } #terminal .ok { color: #34d399; } #terminal .info { color: #22d3ee; }
</style>
</head>
<body>
<header>
  <span class="logo">NOCTUA</span><span class="sub">GREY HAT IDE v0.1</span>
  <span style="margin-left:auto; display:flex; gap:8px;">
    <span class="badge ok">sandbox listo</span>
    <span class="badge" id="provider-badge">cargando…</span>
    <button class="badge action" id="btn-open">Abrir fichero</button>
    <button class="badge action" id="btn-analyze">Analizar</button>
  </span>
</header>
<div class="wrap">
  <div id="sidebar"><h3>Workspace</h3><div id="filelist"></div><h3>Plugins</h3><div id="pluginlist"></div></div>
  <div id="editor"></div>
  <div id="ai">
    <div id="ai-head">
      <button id="p-mistral" class="active">API Mistral</button>
      <button id="p-ollama">Ollama local</button>
    </div>
    <div id="chat"></div>
    <div id="ai-input">
      <textarea id="prompt" placeholder="Pregunta al agente sobre el código… (Ctrl+Enter para enviar)"></textarea>
      <button id="send">Enviar al agente</button>
    </div>
  </div>
</div>
<div id="bottom">
  <div id="tabs"><button class="active">TERMINAL</button><button>SALIDA</button></div>
  <div id="terminal"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<script>
const term = (text, cls) => {
  const el = document.getElementById("terminal");
  const p = document.createElement("div");
  if (cls) p.className = cls;
  p.textContent = text;
  el.appendChild(p);
  el.scrollTop = el.scrollHeight;
};
require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs" } });
require(["vs/editor/editor.main"], function () {
  window.editor = monaco.editor.create(document.getElementById("editor"), {
    value: "// Bienvenido a NOCTUA. Abra un fichero o un binario para analizarlo.",
    language: "python", theme: "vs-dark", automaticLayout: true,
    fontFamily: "'JetBrains Mono', monospace", fontSize: 13
  });
  monaco.editor.defineTheme("noctua", { base: "vs-dark", inherit: true, rules: [], colors: { "editor.background": "#0b0e14" } });
  monaco.editor.setTheme("noctua");
});
const api = window.noctua;
let activeFile = null;
async function refreshProvider(desc) {
  document.getElementById("provider-badge").textContent = desc || await api.ai.describe();
}
async function loadPlugins() {
  const list = await api.plugins.list();
  const el = document.getElementById("pluginlist");
  el.innerHTML = "";
  for (const p of list) {
    const b = document.createElement("button");
    b.className = "file" + (p.enabled ? " active" : "");
    b.textContent = p.name + " v" + p.version + (p.enabled ? " [ON]" : "");
    b.onclick = async () => { const on = await api.plugins.toggle(p.id); b.classList.toggle("active", on); b.textContent = p.name + " v" + p.version + (on ? " [ON]" : ""); };
    el.appendChild(b);
  }
  if (!list.length) el.innerHTML = "<p style='color:#475569;font-size:11px;padding:4px 10px;'>Sin plugins instalados</p>";
}
document.getElementById("btn-open").onclick = async () => {
  const p = await api.fs.pickFile();
  if (!p) return;
  activeFile = p;
  const content = await api.fs.readFile(p);
  if (window.editor) {
    window.editor.setValue(content);
    const lang = p.endsWith(".py") ? "python" : p.endsWith(".js") ? "javascript" : p.endsWith(".md") ? "markdown" : "plaintext";
    monaco.editor.setModelLanguage(window.editor.getModel(), lang);
  }
  term("abierto: " + p, "info");
};
document.getElementById("btn-analyze").onclick = async () => {
  if (!activeFile) return term("abra primero un fichero", "err");
  term("analizando " + activeFile + " …", "info");
  try {
    const r = await api.tools.analyzeBasic(activeFile);
    term(JSON.stringify(r, null, 2), "ok");
    askAgent("Analiza estos resultados de análisis estático: " + JSON.stringify(r));
  } catch (e) { term("error: " + e, "err"); }
};
function addMsg(text, who) {
  const c = document.getElementById("chat");
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}
async function askAgent(prompt) {
  addMsg(prompt, "user");
  try {
    const ctx = { activeFile, code: window.editor ? window.editor.getValue().slice(0, 8000) : null };
    const reply = await api.ai.chat(prompt, ctx);
    addMsg(reply, "bot");
  } catch (e) { addMsg("Error del agente: " + e, "bot"); }
}
document.getElementById("send").onclick = () => askAgent(document.getElementById("prompt").value);
document.getElementById("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.ctrlKey) askAgent(e.target.value);
});
document.getElementById("p-mistral").onclick = async () => {
  await api.ai.switchProvider("mistral"); await refreshProvider();
  document.getElementById("p-mistral").classList.add("active");
  document.getElementById("p-ollama").classList.remove("active");
};
document.getElementById("p-ollama").onclick = async () => {
  await api.ai.switchProvider("ollama"); await refreshProvider();
  document.getElementById("p-ollama").classList.add("active");
  document.getElementById("p-mistral").classList.remove("active");
};
api.tools.onStream((data) => term("[stream] " + data.split("\n").pop(), "info"));
refreshProvider().then(loadPlugins);
addMsg("Sesión iniciada. Tengo acceso al editor, al análisis de ficheros y a los plugins. ¿Qué analizamos hoy?", "bot");
</script>
</body>
</html>
