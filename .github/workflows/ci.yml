name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        env:
          # los tests usan FakePty: no se reconstruye node-pty en el job de tests
          NOCTUA_SKIP_REBUILD: "1"
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        env:
          NOCTUA_SKIP_REBUILD: "1"
      - name: Toolchain para módulos nativos
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools build-essential python3
      - run: npm run rebuild
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
